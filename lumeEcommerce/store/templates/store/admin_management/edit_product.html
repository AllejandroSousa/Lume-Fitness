{% extends 'store/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<style>
    body {
        background-color: #e9ecef;
        font-family: 'Arial', sans-serif;
    }

    .form-layout {
        max-width: 800px;
        margin: 0 auto;
        border-radius: 10px;
        background: linear-gradient(145deg, #ffffff, #f0f0f0);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin-top: 50px;
        margin-bottom: 50px;
    }

    h3, h4 {
        color: #343a40;
        font-weight: 600;
        text-align: center;
        margin-bottom: 20px;
    }

    hr {
        border-top: 2px solid #dee2e6;
        margin: 20px 0;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .text-center a:hover {
        text-decoration: underline;
    }

    table {
        width: 100%;
        margin-bottom: 20px;
    }

    th, td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #dee2e6;
    }

    .btn-small {
        padding: 5px 10px;
        font-size: 14px;
    }
</style>

<div class="container form-layout">
    <h3>Editar Produto: {{ product.title }}</h3>
    <hr>
    <form method="POST" enctype="multipart/form-data" autocomplete="off">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary navbar-btn text-white w-100">
            Salvar Alterações
        </button>
    </form>
    <br>
    <div class="text-center">
        <a href="{% url 'admin_merchandise' %}">Voltar</a>
    </div>
</div>

<script>
    function slugify(text) {
        return text
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .trim();
    }

    const titleField = document.querySelector('#id_title');
    const slugField = document.querySelector('#id_slug');

    if (titleField && slugField) {
        titleField.addEventListener('input', function() {
            const titleValue = titleField.value;
            const slugValue = slugify(titleValue);
            slugField.value = slugValue;
        });
    }
</script>

{% endblock %}
