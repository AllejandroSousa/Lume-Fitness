{% include 'store/base.html' %} {% load static %}
{% load crispy_forms_tags %}

{% block content %}

    <style>
        body {
            background-color: gray;
        }
    </style>

    <body>
        <br>
        <div class="container bg-white shadow-md p-5 form-layout">
            <h3> Deletar sua conta </h3>
            <hr>
            <form method="POST" autocomplete="off">

                {% csrf_token %}
                <p>Você tem certeza de que deseja excluir a sua conta?</p>
                <br>
                <button type="submit" class="btn btn-danger btn-lg w-100 btn-block p-2">
                    &nbsp;
                    Deletar
                </button>
            </form>
        </div>
        <br><br>
    </body>

{% endblock %}
