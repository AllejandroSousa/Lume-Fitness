{% include 'store/base.html' %} {% load static %}
{% load crispy_forms_tags %}

{% block content %}

    <style>
        body {
            background-color: gray;
        }
    </style>

    <body>
        <br>
        <div class="container bg-white shadow-md p-5 form-layout">
            <h3> Deletar sua conta </h3>
            <hr>
            <p>Você tem certeza de que deseja excluir a sua conta?</p>
            <form method="POST" autocomplete="off">

                {% csrf_token %}
                <button type="submit" class="btn btn-danger navbar-btn text-white">
                    &nbsp;
                    Deletar
                </button>
                <br> <br>
                <a class="btn btn-primary navbar-btn text-white" type="button" href="{% url 'profile-management' %}">
                <i class="fa fa-arrow-left" aria-hidden="true"></i>
                    &nbsp;
                    Voltar
                </a>
            </form>
        </div>
        <br><br>
    </body>

{% endblock %}
