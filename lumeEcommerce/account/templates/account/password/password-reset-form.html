{% include 'store/base.html' %} {% load static %}
{% load crispy_forms_tags %}

{% block content %}

<style>
    body {
        background-color: gray;
    }
</style>

<br>

<div class="container bg-white shadow-md p-5 form-layout">

    <h3>Digite a sua nova senha: </h3>
    <hr>
    <p>Por favor, digite a sua nova senha duas vezes
        para garantir que você digitou corretamente.
    </p>

    <form method="post">
        {% csrf_token %}

        {{form|crispy}}

        <button type="submit" class="btn btn-primary navbar-btn text-white w-100">
            &nbsp;
            Atualizar senha
        </button>
    </form>
</div>

{% endblock %}
