{% include 'store/base.html' %} {% load static %}
{% load crispy_forms_tags %}

{% block content %}

<style>
    body {
        background-color: gray;
    }
</style>

<br>
<div class="container bg-white shadow-md p-5 form-layout">
    <h3>Alterar senha</h3>
    <hr>

    <p>Esqueceu sua senha? Coloque o seu e-mail abaixo
        que te enviaremos instruções para alterá-la.
    </p>

    <form method="post">
        {% csrf_token %}

        {{form|crispy}}
        <br>

        <button type="submit" class="btn btn-primary navbar-btn text-white w-100">
            &nbsp;
            Enviar
        </button>
    </form>
</div>

{% endblock %}
