{% extends "store/base.html" %}
{% load static %}
{% block content %}

<style>
  body {
    background-color: gray;
  }
</style>

<body>
  <br />

  <div class="container bg-white shadow-md p-5" style="width: 500px; border-radius: 20px">
    <form id="form" onsubmit="event.preventDefault();">
      <div>
        <h3>
          <i class="fa fa-chevron-circle-right" aria-hidden="true"></i>
          Concluir pedido
        </h3>

        <p>Por favor, preencha os campos abaixo.</p>

        <hr />

        <br />

        <div class="form-field">
          <input
            class="form-control validate"
            id="name"
            type="text"
            placeholder="Nome completo*"
            autocomplete="off"
            value="{{ shipping.full_name }}"
            required
          />
        </div>

        <br />

        <div class="form-field">
          <input
            class="form-control validate"
            id="email"
            type="email"
            placeholder="Email*"
            autocomplete="off"
            value="{{ shipping.email }}"
            required
          />
        </div>

        <br />

        <div class="form-field">
          <input
            class="form-control validate"
            id="zipcode"
            type="text"
            placeholder="CEP*"
            autocomplete="off"
            value="{{ shipping.zipcode }}"
            required
          />
        </div>

        <br />

        <div class="form-field">
          <input
            class="form-control validate"
            id="address1"
            type="text"
            placeholder="Endereço 1*"
            autocomplete="off"
            value="{{ shipping.address1 }}"
            required
          />
        </div>

        <br />

        <div class="form-field">
          <input
            class="form-control"
            id="address2"
            type="text"
            placeholder="Endereço 2"
            autocomplete="off"
            value="{{ shipping.address2 }}"
          />
        </div>

        <br />

        <div class="form-field">
          <input
            class="form-control validate"
            id="city"
            type="text"
            placeholder="Cidade*"
            autocomplete="off"
            value="{{ shipping.city }}"
            required
          />
        </div>

        <br />

        <div class="form-field">
          <input
            class="form-control validate"
            id="state"
            type="text"
            placeholder="Estado*"
            autocomplete="off"
            value="{{ shipping.state }}"
            required
          />
        </div>

        <br />

        <div class="form-field">
          <select class="form-control validate" id="seller" required>
            <option value="" disabled selected>Selecione o vendedor*</option>
            {% for seller in sellers %}
              <option value="{{ seller.id }}">{{ seller.name }}</option>
            {% endfor %}
          </select>
        </div>

        <br />

        <div class="form-field">
          <select class="form-control validate" id="payment_method" required>
            <option value="" disabled selected>Selecione o método de pagamento*</option>
            <option value="PIX">Pix</option>
            <option value="CREDIT_CARD">Cartão de Crédito</option>
            <option value="BERRIES">Berries</option>
          </select>
        </div>
      </div>

      <br />

      <!-- Keeping this for non-PayPal testing -->
      <button
        id="complete-order"
        type="submit"
        class="btn btn-primary navbar-btn text-white"
      >
        Concluir pedido
      </button>

      <br />

      <!-- PayPal button container -->
      <div id="paypal-button-container"></div>

      <!-- PayPal client ID integration -->
      <script
        src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=BRL"
        data-sdk-integration-source="integrationbuilder"
      ></script>
    </form>
  </div>

  <br />
</body>

<script>
  // Total price
  var total_price = "{{ cart.get_total }}";

  console.log(total_price);

  // PayPal JS SDK
  const paypalButtonsComponent = paypal.Buttons({
    style: {
      color: "gold",
      shape: "rect",
      layout: "vertical",
    },

    onInit: function (data, actions) {
      actions.disable();

      document.querySelectorAll(".validate").forEach((item) => {
        item.addEventListener("change", (event) => {
          var order_verified = true;

          document.querySelectorAll(":input[required]").forEach((input) => {
            if (!input.value) {
              order_verified = false;
            }
          });

          if (order_verified) {
            actions.enable();
          } else {
            actions.disable();
          }
        });
      });
    },

    createOrder: (data, actions) => {
      const createOrderPayload = {
        purchase_units: [
          {
            amount: {
              value: total_price,
            },
          },
        ],
      };

      return actions.order.create(createOrderPayload);
    },

    onApprove: (data, actions) => {
      const captureOrderHandler = (details) => {
        const payerName = details.payer.name.given_name;
        console.log("Transaction completed");

        $.ajax({
          type: "POST",
          url: "{% url 'complete-order' %}",
          data: {
            name: $("#name").val(),
            email: $("#email").val(),
            zipcode: $("#zipcode").val(),
            address1: $("#address1").val(),
            address2: $("#address2").val(),
            city: $("#city").val(),
            state: $("#state").val(),
            seller: $("#seller").val(),
            payment_method: $("#payment_method").val(),
            csrfmiddlewaretoken: "{{ csrf_token }}",
            action: "post",
          },
          success: function (json) {
            window.location.replace("{% url 'payment-success' %}");
          },
          error: function (xhr, errmsg, err) {
            window.location.replace("{% url 'payment-failed' %}");
          },
        });
      };

      return actions.order.capture().then(captureOrderHandler);
    },

    onError: (err) => {
      console.error("An error prevented the buyer from checking out with PayPal");
    },
  });

  paypalButtonsComponent.render("#paypal-button-container").catch((err) => {
    console.error("PayPal Buttons failed to render");
  });

  // Non-PayPal checkout
  $(document).on("submit", "#form", function (e) {
    e.preventDefault();
    $.ajax({
      type: "POST",
      url: "{% url 'complete-order' %}",
      data: {
        name: $("#name").val(),
        email: $("#email").val(),
        zipcode: $("#zipcode").val(),
        address1: $("#address1").val(),
        address2: $("#address2").val(),
        city: $("#city").val(),
        state: $("#state").val(),
        seller: $("#seller").val(),
        payment_method: $("#payment_method").val(),
        csrfmiddlewaretoken: "{{ csrf_token }}",
        action: "post",
      },
      success: function (json) {
        window.location.replace("{% url 'payment-success' %}");
      },
      error: function (xhr, errmsg, err) {
        window.location.replace("{% url 'payment-failed' %}");
      },
    });
  });
</script>

{% endblock %}
